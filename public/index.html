<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Discord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="banner" class="hidden"></div>
<div id="toast" class="hidden"></div>

<div id="login" class="login-loading">
  <div class="login-card">
    <h1>Meu Discord</h1>
    <p>Conectando como visitante…</p>
    <div class="loader" aria-label="Carregando"></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="section">Canais de texto</div>
    <div id="textList"></div>
    <div class="section">Canais de voz</div>
    <div id="voiceList"></div>
    <div class="section" id="onlineTitle">Online</div>
    <div id="onlineList"></div>
    <div id="me">
      <span id="meName"></span>
      <span class="meBtns">
        <button id="btnAdmin" class="small hidden" title="Painel de admin">⚙️</button>
        <button id="btnLogout" class="small" title="Sair da conta">⎋</button>
      </span>
    </div>
  </aside>

  <main id="main">
    <section id="stage" class="hidden">
      <div id="grid"></div>
      <div id="controls">
        <button id="btnMic" title="Microfone">🎤 Mic</button>
        <button id="btnDeaf" title="Ensurdecer">🎧 Som</button>
        <button id="btnCam" title="Câmera">📷 Câmera</button>
        <button id="btnScreen" title="Compartilhar tela">🖥️ Tela</button>
        <button id="btnChat" title="Mostrar/ocultar o chat">💬 Chat</button>
        <button id="btnLeave" class="danger" title="Sair da sala">📞 Sair</button>
      </div>
    </section>

    <section id="chat">
      <header id="chatTitle"></header>
      <div id="messages"></div>
      <form id="msgForm">
        <input id="msgInput" autocomplete="off" placeholder="Enviar mensagem...">
      </form>
    </section>
  </main>
</div>

<div id="adminModal" class="modal hidden">
  <div class="modalBox">
    <header>
      <b>Painel de admin</b>
      <button id="adminClose" class="small">✕</button>
    </header>
    <div class="adminActions">
      <button id="btnBackup">⬇️ Baixar backup</button>
      <button id="btnRestore" class="danger">⬆️ Restaurar backup</button>
      <input type="file" id="restoreFile" accept=".json,application/json" class="hidden">
    </div>
    <p class="muted" id="adminInfo"></p>
    <div id="adminUsers"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
